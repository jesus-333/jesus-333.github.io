# =====================================================================
#  SINGLE SOURCE OF TRUTH for every CV output in this repository.
#
#  Edit this file, then run `make cv`. It generates, and you never edit
#  by hand:
#    _data/cv.yml                 the website's /cv/ page
#    assets/json/resume.json      the JSON Resume twin
#    cv_tex/generated/*.tex       the LaTeX CV
#    _bibliography/papers.bib     copy of common_material/papers.bib
#
#  TWO CONVENTIONS USED THROUGHOUT
#
#  1. `<field>_tex` -- an optional sibling of any string field. When
#     present it is emitted VERBATIM into LaTeX (no escaping), while the
#     plain field still feeds the website. Use it when you deliberately
#     want LaTeX markup: \textbar{}, \textsuperscript{}, \emph{}.
#
#  2. `@TODO{...}` -- an inline placeholder. In LaTeX it becomes
#     \cvTODO{...} and typesets in RED so it cannot ship unnoticed. The
#     website generators REFUSE TO RUN while one is present unless you
#     pass --allow-todo, so a placeholder can never leak onto a public
#     page. An entry-level `todo = true` marks a whole entry: red in the
#     PDF, omitted entirely from the website.
#
#  Dates are ALWAYS quoted strings: "YYYY", "YYYY-MM", "YYYY-MM-DD" or
#  "present". Never a bare date literal -- TOML would turn it into a
#  datetime and destroy the year-vs-month distinction.
# =====================================================================

schema_version = 1

