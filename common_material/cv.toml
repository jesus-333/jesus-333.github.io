# ---------------------------------------------------------------------
#  PUBLICATIONS -- metadata only.
#  The records themselves live in common_material/papers.bib and are
#  never duplicated here. This table only decides selection, grouping
#  and per-entry corrections.
# ---------------------------------------------------------------------
[publications]
bib = "common_material/papers.bib"
# Accepted spellings of your own name, for \me bolding.
me_author_keys = ["Zancanaro, Alberto", "Zancanaro, A", "Zancanaro, A."]
# zancanaro2025modeling is the PhD thesis (already in Education);
# zancanaro2021proceedings is a proceedings record of zancanaro2021cnn.
exclude = ["zancanaro2025modeling", "zancanaro2021proceedings"]
# Default three for the one-page CV. A [profiles.*] entry overrides this.
featured = ["cisotto2024hveegnet", "zancanaro2025blockdtw", "zancanaro2023veegnet_springer"]

# class routes the entry into a \subsection*{} of the long CV:
# journal | conference | preprint | thesis
[publications.overrides.cisotto2023hveegnet]
class = "preprint"
url   = "https://arxiv.org/abs/2312.00799"

